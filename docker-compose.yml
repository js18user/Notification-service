version: '3.8'

services:
  caddy:
    image: caddy:latest
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - app
      - grafana
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/fastapi.json"
    volumes:
      - ./grafana_datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml
      - ./grafana_provider.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./fastapi_dashboard.json:/var/lib/grafana/dashboards/fastapi.json
    restart: unless-stopped
